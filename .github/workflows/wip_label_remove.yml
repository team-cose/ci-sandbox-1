name: Remove Work In Progress Label

permissions:
  pull-requests: write

on:
  pull_request_review:
    types: [submitted]

jobs:
  remove_wip_label:
    if: |
      github.event.review.state == 'approved' &&
      (github.event.review.author_association == 'MEMBER' || github.event.review.author_association == 'OWNER' || github.event.review.author_association == 'COLLABORATOR')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check for label and remove
        uses: actions/github-script@v7
        with:
          script: |
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const hasLabel = labels.some(l => l.name === 'work in progress');
            if (!hasLabel) {
              core.info('Label "work in progress" not found, skipping');
              return;
            }
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: 'work in progress',
            });
            core.info('Removed "work in progress" label');
