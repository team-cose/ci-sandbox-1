name: Merge Queue

on:
  merge_group:
  pull_request:

jobs:
  scorecard:
    name: Scorecard security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Fail on critical findings
        run: |
          critical=$(jq '
            [.runs[] | . as $run |
              ($run.tool.driver.rules | map({(.id): .properties["security-severity"]}) | add // {}) as $sev |
              $run.results[] |
              select(($sev[.ruleId] // "0") | tonumber >= 9.0)
            ] | length' results.sarif)
          if [ "$critical" -gt 0 ]; then
            echo "::error::Scorecard found $critical critical finding(s):"
            jq -r '
              .runs[] | . as $run |
              ($run.tool.driver.rules | map({(.id): .properties["security-severity"]}) | add // {}) as $sev |
              $run.results[] |
              select(($sev[.ruleId] // "0") | tonumber >= 9.0) |
              "\(.ruleId) (severity: \($sev[.ruleId])): \(.message.text)"' results.sarif
            exit 1
          fi
          echo "No critical findings detected"

  merge-queue-check:
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    needs:
      - scorecard
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.scorecard.result }}" != "success" ]]; then
            echo "Scorecard job failed or was cancelled"
            exit 1
          fi
          echo "All checks passed"
