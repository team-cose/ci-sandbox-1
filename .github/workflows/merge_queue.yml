name: Merge Queue

on:
  merge_group:
    types: [checks_requested]
  pull_request:

jobs:
  scorecard:
    name: Scorecard security scan
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # scorecard-action enforces a default-branch-only restriction that
      # cannot be bypassed in a merge queue (GITHUB_* env vars are
      # read-only). Use the scorecard CLI directly instead.
      - name: Install Scorecard
        run: |
          SCORECARD_VERSION=5.1.1
          curl -sL https://github.com/ossf/scorecard/releases/download/v${SCORECARD_VERSION}/scorecard_${SCORECARD_VERSION}_linux_amd64.tar.gz | tar xz scorecard
          mv scorecard /usr/local/bin/scorecard

      - name: Run Scorecard analysis
        run: |
          scorecard \
            --local=. \
            --format=json \
            --show-details \
            --show-annotations \
            -o results.json

      - name: Fail on critical findings
        env:
          # Checks classified as "Critical" risk by scorecard
          CRITICAL_CHECKS: Dangerous-Workflow Webhooks
        run: |
          for check in $CRITICAL_CHECKS; do
            score=$(jq -r --arg name "$check" '.checks[] | select(.name == $name) | .score' results.json)
            reason=$(jq -r --arg name "$check" '.checks[] | select(.name == $name) | .reason' results.json)
            if [ -n "$score" ] && [ "$score" != "-1" ] && [ "$score" -lt 10 ]; then
              echo "::error::$check (score: $score/10): $reason"
              failed=1
            fi
          done
          if [ "${failed:-0}" = "1" ]; then
            exit 1
          fi
          echo "No critical findings detected"

  merge-queue-check:
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    needs:
      - scorecard
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
          echo "All checks passed"
